name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Lint
        run: |
          ruff check src tests
          black --check src tests

  wayland:
    name: Linux Wayland / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless compositor and clipboard tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y sway wl-clipboard
      - name: Install md2plain
        run: python -m pip install -e "."
      - name: Test real Wayland clipboard
        env:
          MD2PLAIN_WAYLAND_TEST: "1"
        run: python -m unittest discover -s tests -p test_wayland_integration.py -v
