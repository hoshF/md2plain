[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md2plain"
dynamic = ["version"]
description = "Convert Markdown to plain-text email for Gmail's Plain text mode."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "hoshF", email = "noveor.ol@gmail.com" }]
keywords = ["markdown", "plain-text", "email", "gmail", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Email",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "markdown-it-py>=3.0",
  "linkify-it-py>=2.0",
  "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["black>=24", "ruff>=0.6"]

[project.scripts]
md2plain = "md2plain.cli:main"

[project.urls]
Homepage = "https://github.com/hoshF/md2plain"
Issues = "https://github.com/hoshF/md2plain/issues"

[tool.hatch.version]
path = "src/md2plain/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/md2plain"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
